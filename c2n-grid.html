<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柔美花語 ✿ 網格搶數遊戲 (上限50格)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fbf7f8 0%, #f0f4f9 100%);
            padding: 20px;
            color: #5a6578;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(210, 190, 200, 0.25), 0 5px 15px rgba(180, 200, 220, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.8);
            width: 100%;
            max-width: 580px;
            padding: 30px 25px;
            position: relative;
            overflow: hidden;
        }

        /* 唯美花草裝飾 SVG */
        .flower-decoration-top {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 110px;
            height: 110px;
            opacity: 0.65;
            pointer-events: none;
        }

        .flower-decoration-bottom {
            position: absolute;
            bottom: -15px;
            left: -15px;
            width: 120px;
            height: 120px;
            opacity: 0.65;
            pointer-events: none;
            transform: rotate(180deg);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 500;
            color: #6a7c92;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: #b0a0aa;
            letter-spacing: 1px;
        }

        /* 自由選擇面板 */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
        }

        .input-wrapper label {
            font-size: 12px;
            color: #8c9ba5;
            margin-bottom: 4px;
            padding-left: 2px;
            font-weight: 500;
        }

        select {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid #e3e8ee;
            border-radius: 12px;
            background: #fcfbfe;
            color: #556070;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:focus {
            border-color: #ffd6e0;
            box-shadow: 0 0 0 3px rgba(255, 214, 224, 0.3);
            background: #ffffff;
        }

        /* 狀態標籤 */
        .status-banner {
            text-align: center;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .current-turn-badge {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            background: #ffeef2;
            color: #e6738f;
            box-shadow: 0 2px 8px rgba(230, 180, 200, 0.2);
            transition: all 0.3s ease;
        }

        .current-turn-badge.p2-turn {
            background: #eef4ff;
            color: #5b86e5;
        }

        /* 動態網格區 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
            max-height: 280px;
            overflow-y: auto;
            padding: 4px;
        }

        .grid-tile {
            aspect-ratio: 1;
            background: #ffffff;
            border: 1.5px solid #eaeef3;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 3px 8px rgba(0,0,0,0.02);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .grid-tile .num {
            font-size: 14px;
            font-weight: 700;
            color: #9cb0c5;
            transition: all 0.3s ease;
        }

        .grid-tile .tag {
            font-size: 8px;
            font-weight: 500;
            margin-top: 1px;
            opacity: 0;
            transform: translateY(3px);
            transition: all 0.3s ease;
        }

        /* 玩家 1 (粉紅) */
        .grid-tile.claimed-p1 {
            background: linear-gradient(135deg, #ffd6e0 0%, #ffc2d1 100%);
            border-color: #f7aef8;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(255, 180, 200, 0.4);
        }

        .grid-tile.claimed-p1 .num, .grid-tile.claimed-p1 .tag {
            color: #ffffff;
            opacity: 1;
            transform: translateY(0);
        }

        /* 玩家 2 / AI (薄霧藍) */
        .grid-tile.claimed-p2 {
            background: linear-gradient(135deg, #a8c0ff 0%, #8ea8f7 100%);
            border-color: #7292f7;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(168, 192, 255, 0.4);
        }

        .grid-tile.claimed-p2 .num, .grid-tile.claimed-p2 .tag {
            color: #ffffff;
            opacity: 1;
            transform: translateY(0);
        }

        /* 按鈕區 */
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .add-btn {
            flex: 1;
            min-width: 60px;
            padding: 12px 8px;
            border: none;
            border-radius: 14px;
            background: #ffffff;
            border: 1.5px solid #e8ecf2;
            color: #6a7c92;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: all 0.25s ease;
        }

        .add-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #a8c0ff;
            color: #5b86e5;
            box-shadow: 0 6px 15px rgba(168, 192, 255, 0.3);
            background: #fcfdfe;
        }

        .add-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: #eee;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #a8c0ff 0%, #fbc2eb 100%);
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(230, 180, 200, 0.4);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            margin-bottom: 18px;
        }

        .reset-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* 歷史紀錄 */
        .history-card {
            background: rgba(255, 255, 255, 0.65);
            border-radius: 14px;
            padding: 12px 15px;
            border: 1px solid #f0e6eb;
            max-height: 110px;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        .history-card h3 {
            font-size: 12px;
            color: #a0acb8;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            font-size: 13px;
            color: #6a7c92;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 4px;
            border-bottom: 1px dashed #edf1f5;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        /* 勝利彈窗 */
        .winner-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            border-radius: 24px;
        }

        .winner-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .winner-title {
            font-size: 26px;
            font-weight: 700;
            color: #6a7c92;
            margin-bottom: 10px;
        }

        .winner-sub {
            font-size: 15px;
            color: #8c9ba5;
            margin-bottom: 25px;
        }

        .play-again-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #a8c0ff 0%, #fbc2eb 100%);
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(210, 160, 190, 0.4);
            transition: all 0.3s ease;
        }

        .play-again-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- 右上角櫻花 SVG 裝飾 -->
    <svg class="flower-decoration-top" viewBox="0 0 100 100">
        <path d="M70,30 C75,15 90,20 85,35 C95,45 85,60 70,55 C65,70 50,65 55,50 C40,45 50,30 65,35 Z" fill="#ffd6e0" opacity="0.6"/>
        <circle cx="70" cy="42" r="5" fill="#f7aef8"/>
        <path d="M40,20 Q55,10 65,25" stroke="#a8c0ff" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="40" cy="20" r="3" fill="#b8c0ff"/>
        <circle cx="70" cy="90" r="3.5" fill="#ffd1dc"/>
    </svg>

    <!-- 左下角花草 SVG 裝飾 -->
    <svg class="flower-decoration-bottom" viewBox="0 0 100 100">
        <path d="M70,30 C75,15 90,20 85,35 C95,45 85,60 70,55 C65,70 50,65 55,50 C40,45 50,30 65,35 Z" fill="#b8c0ff" opacity="0.5"/>
        <circle cx="70" cy="42" r="5" fill="#a8c0ff"/>
        <path d="M40,20 Q55,10 65,25" stroke="#f7aef8" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="40" cy="20" r="3" fill="#ffd6e0"/>
    </svg>

    <div class="header">
        <h1>✿ 自訂網格搶數遊戲 ✿</h1>
        <p>自由選擇目標格數 (最高 50 格) 與每回合上限</p>
    </div>

    <!-- 自由選擇選單 (最高至 50 格) -->
    <div class="settings-grid">
        <div class="input-wrapper">
            <label for="target-select">目標總格數 (上限 50)</label>
            <select id="target-select" onchange="resetGame()">
                <option value="10">搶 10 格</option>
                <option value="20">搶 20 格</option>
                <option value="21">搶 21 格 (經典)</option>
                <option value="30">搶 30 格</option>
                <option value="40">搶 40 格</option>
                <option value="50" selected>搶 50 格 (最高上限)</option>
            </select>
        </div>
        <div class="input-wrapper">
            <label for="max-step-select">每回合最多喊</label>
            <select id="max-step-select" onchange="resetGame()">
                <option value="2">＋ 1~2 格</option>
                <option value="3" selected>＋ 1~3 格 (經典)</option>
                <option value="4">＋ 1~4 格</option>
                <option value="5">＋ 1~5 格</option>
            </select>
        </div>
        <div class="input-wrapper">
            <label for="mode-select">對戰模式</label>
            <select id="mode-select" onchange="resetGame()">
                <option value="ai">單人對抗 AI</option>
                <option value="pvp">雙人同機對戰</option>
            </select>
        </div>
        <div class="input-wrapper" id="ai-difficulty-group">
            <label for="ai-select">AI 難度</label>
            <select id="ai-select" onchange="resetGame()">
                <option value="smart">挑戰模式 (必勝AI)</option>
                <option value="easy">輕鬆模式 (隨機AI)</option>
            </select>
        </div>
    </div>

    <!-- 狀態標籤 -->
    <div class="status-banner">
        <div class="current-turn-badge" id="turn-badge">玩家 1 的回合</div>
    </div>

    <!-- 動態網格容器 -->
    <div class="grid-container" id="grid-container">
        <!-- JavaScript 動態生成 -->
    </div>

    <!-- 操作按鈕區 -->
    <div class="actions" id="actions-container">
        <!-- JavaScript 動態生成按鈕 -->
    </div>

    <button class="reset-btn" onclick="resetGame()">重新開始新局</button>

    <!-- 歷程紀錄 -->
    <div class="history-card">
        <h3>報數歷程紀錄</h3>
        <ul class="history-list" id="history-list">
            <!-- 動態插入 -->
        </ul>
    </div>

    <!-- 勝利彈窗 -->
    <div class="winner-modal" id="winner-modal">
        <div class="winner-title" id="winner-title">✿ 玩家 1 獲勝！ ✿</div>
        <div class="winner-sub" id="winner-sub">順利奪下最後關鍵的卡片！</div>
        <button class="play-again-btn" onclick="resetGame()">再開一局</button>
    </div>
</div>

<script>
    let currentNum = 0;
    let targetNum = 50;
    let maxStep = 3;
    let currentPlayer = 1; 
    let isGameOver = false;

    function initGameConfig() {
        targetNum = parseInt(document.getElementById('target-select').value);
        maxStep = parseInt(document.getElementById('max-step-select').value);

        // 生成 1 ~ targetNum 個卡片網格
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        for (let i = 1; i <= targetNum; i++) {
            const tile = document.createElement('div');
            tile.className = 'grid-tile';
            tile.id = `tile-${i}`;
            tile.setAttribute('data-num', i);
            tile.innerHTML = `
                <span class="num">${i}</span>
                <span class="tag">✿</span>
            `;
            container.appendChild(tile);
        }

        // 生成 1 ~ maxStep 個操作按鈕
        const actionsContainer = document.getElementById('actions-container');
        actionsContainer.innerHTML = '';
        for (let s = 1; s <= maxStep; s++) {
            const btn = document.createElement('button');
            btn.className = 'add-btn';
            btn.id = `btn-${s}`;
            btn.innerText = `＋ ${s} 格`;
            btn.onclick = () => playerMove(s);
            actionsContainer.appendChild(btn);
        }
    }

    function playerMove(addVal) {
        if (isGameOver) return;

        executeMove(currentPlayer, addVal);

        if (currentNum >= targetNum) {
            endGame(currentPlayer);
            return;
        }

        const mode = document.getElementById('mode-select').value;
        if (mode === 'ai') {
            currentPlayer = 2;
            updateUI();
            disableButtons(true);
            setTimeout(aiMove, 600);
        } else {
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updateUI();
        }
    }

    function aiMove() {
        if (isGameOver) return;

        const difficulty = document.getElementById('ai-select').value;
        let choice = 1;
        const stepPeriod = maxStep + 1;

        if (difficulty === 'smart') {
            let rem = (targetNum - currentNum) % stepPeriod;
            if (rem !== 0) {
                choice = rem;
            } else {
                const maxChoices = Math.min(maxStep, targetNum - currentNum);
                choice = Math.floor(Math.random() * maxChoices) + 1;
            }
        } else {
            const maxChoices = Math.min(maxStep, targetNum - currentNum);
            choice = Math.floor(Math.random() * maxChoices) + 1;
        }

        executeMove('AI', choice);

        if (currentNum >= targetNum) {
            endGame('AI');
            return;
        }

        currentPlayer = 1;
        updateUI();
        disableButtons(false);
    }

    function executeMove(player, addVal) {
        const start = currentNum + 1;
        const end = currentNum + addVal;

        for (let i = start; i <= end; i++) {
            const tile = document.getElementById(`tile-${i}`);
            if (tile) {
                const tagEl = tile.querySelector('.tag');
                if (player === 1 || player === '玩家 1') {
                    tile.classList.add('claimed-p1');
                    tagEl.innerText = 'P1';
                } else {
                    tile.classList.add('claimed-p2');
                    tagEl.innerText = player === 'AI' ? 'AI' : 'P2';
                }
            }
        }

        currentNum = end;

        // 平滑滾動至最新喊到的格子
        const latestTile = document.getElementById(`tile-${end}`);
        if (latestTile) {
            latestTile.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        let numRangeStr = addVal === 1 ? `${end}` : `${start} ~ ${end}`;
        const playerName = typeof player === 'number' ? `玩家 ${player}` : player;
        addHistory(playerName, numRangeStr, addVal);
    }

    function updateUI() {
        const turnBadge = document.getElementById('turn-badge');
        const mode = document.getElementById('mode-select').value;

        if (mode === 'ai') {
            if (currentPlayer === 1) {
                turnBadge.innerText = '玩家的回合 (粉紅卡片)';
                turnBadge.classList.remove('p2-turn');
            } else {
                turnBadge.innerText = 'AI 思考中...';
                turnBadge.classList.add('p2-turn');
            }
        } else {
            if (currentPlayer === 1) {
                turnBadge.innerText = '玩家 1 的回合 (粉紅卡片)';
                turnBadge.classList.remove('p2-turn');
            } else {
                turnBadge.innerText = '玩家 2 的回合 (藍色卡片)';
                turnBadge.classList.add('p2-turn');
            }
        }

        for (let i = 1; i <= maxStep; i++) {
            const btn = document.getElementById(`btn-${i}`);
            if (btn) {
                if (currentNum + i > targetNum) {
                    btn.disabled = true;
                } else if (currentPlayer === 1 || mode === 'pvp') {
                    btn.disabled = false;
                }
            }
        }
    }

    function disableButtons(disabled) {
        for (let i = 1; i <= maxStep; i++) {
            const btn = document.getElementById(`btn-${i}`);
            if (btn) {
                if (!disabled && currentNum + i <= targetNum) {
                    btn.disabled = false;
                } else {
                    btn.disabled = true;
                }
            }
        }
    }

    function addHistory(player, rangeStr, addVal) {
        const historyList = document.getElementById('history-list');
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
            <span class="history-player">${player}</span>
            <span>奪下 <strong>${rangeStr} 格</strong></span>
            <span class="history-add">+${addVal}</span>
        `;
        historyList.appendChild(li);

        const historyCard = document.querySelector('.history-card');
        historyCard.scrollTop = historyCard.scrollHeight;
    }

    function endGame(winner) {
        isGameOver = true;
        disableButtons(true);

        const winnerModal = document.getElementById('winner-modal');
        const winnerTitle = document.getElementById('winner-title');
        const winnerSub = document.getElementById('winner-sub');
        const mode = document.getElementById('mode-select').value;

        let winnerText = '';
        if (mode === 'ai') {
            winnerText = winner === 1 ? '✿ 您獲得了勝利！ ✿' : '✿ AI 獲得了勝利！ ✿';
        } else {
            winnerText = `✿ 玩家 ${winner} 獲得了勝利！ ✿`;
        }

        winnerTitle.innerText = winnerText;
        winnerSub.innerText = `順利奪下最後關鍵的第 ${targetNum} 花朵卡片！`;

        setTimeout(() => {
            winnerModal.classList.add('show');
        }, 400);
    }

    function resetGame() {
        currentNum = 0;
        currentPlayer = 1;
        isGameOver = false;

        document.getElementById('winner-modal').classList.remove('show');
        document.getElementById('history-list').innerHTML = '';

        const mode = document.getElementById('mode-select').value;
        const aiGroup = document.getElementById('ai-difficulty-group');

        if (mode === 'pvp') {
            aiGroup.style.display = 'none';
        } else {
            aiGroup.style.display = 'block';
        }

        initGameConfig();
        updateUI();
        disableButtons(false);
    }

    window.onload = resetGame;
</script>

</body>
</html>
